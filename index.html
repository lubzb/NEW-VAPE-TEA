<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sign In · Vape & Tea House POS</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="login-wrap">
        <div class="card login-card">
            <div class="brand">
                <i class="fas fa-leaf"></i>
                <h2>Vape & Tea House</h2>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input class="form-control" id="loginUsername" placeholder="Username" required autocomplete="username" />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input class="form-control" id="loginPassword" type="password" placeholder="Password" required autocomplete="current-password" />
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary w-full" style="width:100%;justify-content:center;padding:0.7rem;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="demo-hint">
                Trouble signing in? Contact your administrator to have an account created in the <strong>users</strong> table.
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/db.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // If already logged in, skip straight to the app.
        if (getSessionUserId()) {
            window.location.href = 'app.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            try {
                const user = await attemptLogin(username, password);
                if (user) {
                    toast('Welcome, ' + user.name + '!', 'success');
                    setTimeout(() => { window.location.href = 'app.html'; }, 300);
                } else {
                    toast('Invalid username or password', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                }
            } catch (err) {
                toast('Login failed: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });
    </script>
</body>
</html>
